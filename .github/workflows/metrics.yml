name: Metrics
on:
  schedule: [{ cron: "7 * * * *" }]
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: gh-metrics/metrics@0252603d89e89b96f0413c3cb6b0649b64387ba9 # master
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          config_timezone: Asia/Shanghai

          plugin_achievements: yes
          plugin_achievements_threshold: B

          plugin_activity: yes

          plugin_gists: yes

          plugin_habits: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_lines: yes

          plugin_notable: yes
          plugin_notable_repositories: yes

          plugin_traffic: yes
